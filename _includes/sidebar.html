<div class="sidebar">
  <div class="container sidebar-sticky-top">
    <div class="sidebar-about">
      <h1>
        <a href="{{ site.baseurl }}">
          {{ site.description }}
        </a>
      </h1>
      <p class="lead">{{ site.tagline }}</p>
    </div>

    <nav class="sidebar-nav">
      <a class="sidebar-nav-item{% if page.url == '/' %} active{% endif %}" href="{{ site.baseurl }}">HOME</a>
      <a class="sidebar-nav-item{% if page.url contains '/about' %} active{% endif %}" href="{{ site.baseurl }}about/">ABOUT</a>
      <a class="sidebar-nav-item{% if page.url contains '/contact' %} active{% endif %}" href="{{ site.baseurl }}contact/">CONTACT</a>
    </nav>
  </div>

  <style>
    .container a {
      display: inline-block;
      margin-right: 10px;
    }
  </style>

  <div class="container sidebar-sticky-bottom">
    <a href="https://www.linkedin.com/in/abate-de-mey/" target="_blank">
      <img border="0" alt="LinkedIn"  src="/assets/linkedin.png" width="20">
    </a>
    <a href="https://twitter.com/AbateDeMey" target="_blank">
      <img border="0" alt="twitter"  src="/assets/twitter.png" width="20">
    </a>
    <a href="https://www.tiktok.com/@robohubpodcast" target="_blank">
      <img border="0" alt="tiktok"  src="/assets/tiktok.png" width="20">
    </a>
  </div>

</div>
