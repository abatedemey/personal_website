# Dependencies
markdown:         kramdown
highlighter:      pygments

# Permalinks
permalink:        pretty
relative_permalinks: false

# Setup
title:            'Abate De Mey'
tagline:          'Founder, ClinicOS'
description:      'Abate'
baseurl:          /
url:              https://abatedemey.com

author:
  name:           'Abate De Mey'
  url:            https://www.linkedin.com/in/abate-de-mey/

paginate:         3
paginate_path:   "/robohub_posts/page:num/"

# Custom vars
version:          2.1.0

plugins:          [jekyll-paginate]

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - Makefile
  - WEBSITE_STRATEGY.md
  - _scripts
  - docs
  - .bundle
